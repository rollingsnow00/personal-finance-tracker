spring.application.name=personal-finance-tracker
server.port=${PORT:8080}

# PostgreSQL is the normal runtime database. Local credentials stay outside source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/personal_finance_tracker}
spring.datasource.username=${DB_USERNAME:finance_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the development schema aligned with the course instructions.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.error.include-message=never
server.error.include-stacktrace=never
